[project]
name = "showyourwork"
version = "0.1.0"
description = "MCP-native provenance gateway for AI-assisted academic work — tamper-evident, cryptographically signed proof of process."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]",
    "fastmcp",
    "httpx",
    "cryptography",
    "diff-match-patch",
    "aiosqlite",
    "rich",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway", "proof_of_process", "mock_servers"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
